    <style>
        /* This removes the "Invisible Wall" at the top of the screen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents accidental scrolling */
        }
        .hidden-viewport {
            display: none !important;
        }
        /* Custom pulsing dots timeline animation */
        /* 🌟 Updated to cycle perfectly twice within our 2-second loader window */
        .neural-loading-dots span {
            animation: neuralDotPulse 1.0s infinite both;
            display: inline-block;
        }
        .neural-loading-dots span:nth-child(1) { animation-delay: 0s; }
        .neural-loading-dots span:nth-child(2) { animation-delay: 0.15s; } /* Slightly tighter stagger */
        .neural-loading-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes neuralDotPulse {
            0%, 80%, 100% { 
                opacity: 0.2; 
                transform: scale(0.95); 
            }
            40% { 
                opacity: 1; 
                transform: scale(1.1); 
                color: #c084fc; /* High-yield glowing purple pulse */
            }
        }
        /* Lock the sidebar to always fill the screen height */
        aside, #sidebar-container {
            min-height: calc(100vh - 60px) !important; /* Adjust offset based on top nav height */

            flex-direction: column !important;
            justify-content: space-between !important;
        }
