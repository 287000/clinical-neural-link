    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Standard App Locking */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .hidden-viewport {
            display: none !important;
        }

        /* Custom pulsing dots timeline animation */
        .neural-loading-dots span {
            animation: neuralDotPulse 1.0s infinite both;
            display: inline-block;
        }
        .neural-loading-dots span:nth-child(1) { animation-delay: 0s; }
        .neural-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .neural-loading-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes neuralDotPulse {
            0%, 80%, 100% { 
                opacity: 0.2; 
                transform: scale(0.95); 
            }
            40% { 
                opacity: 1; 
                transform: scale(1.1); 
                color: #c084fc; 
            }
        }

        /* 🎯 STRICT RESPONSIVE SIDEBAR OVERRIDES */
        /* Force-hide sidebar by default on mobile screens */
        aside, #sidebar-container {
            display: none;
        }

        /* Display flex ONLY on desktop viewports */
        @media (min-width: 1024px) {
            aside, #sidebar-container {
                min-height: calc(100vh - 60px);
                display: flex !important;
                flex-direction: column;
                justify-content: space-between;
            }
            #sidebar-profile {
                margin-top: auto;
            }
