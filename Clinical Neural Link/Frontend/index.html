    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Force root html and body to flex naturally on mobile & tablets */
        html, body {
            width: 100% !important;
            min-height: 100vh !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* 📱 UNIVERSAL MOBILE & TABLET RESPONSIVE OVERRIDES */
        @media (max-width: 768px) {
            /* Force all dynamically injected containers/cards to fit within screen width */
            #app-viewport, 
            #app-viewport * {
                max-width: 100% !important;
            }

            /* Adjust mobile card padding so inputs remain legible */
            #app-viewport > div {
                width: 92% !important;
                margin-left: auto !important;
                margin-right: auto !important;
                padding: 1.5rem 1.25rem !important;
            }

            /* Ensure form inputs and buttons do not overflow card boundaries */

                box-sizing: border-box !important;
            }
        }

        .hidden-viewport {
            display: none !important;
        }

        /* Custom pulsing dots timeline animation */
        .neural-loading-dots span {
            animation: neuralDotPulse 1.0s infinite both;
            display: inline-block;
        }
        .neural-loading-dots span:nth-child(1) { animation-delay: 0s; }
        .neural-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .neural-loading-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes neuralDotPulse {
            0%, 80%, 100% { 
                opacity: 0.2; 
                transform: scale(0.95); 
            }
            40% { 
                opacity: 1; 
                transform: scale(1.1); 
                color: #c084fc; 
            }
        }

        /* Desktop layout rules for tablets in landscape & large screens */
        @media (min-width: 769px) {

                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            #sidebar-profile {
                margin-top: auto;
            }
        }
